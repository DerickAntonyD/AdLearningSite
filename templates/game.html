<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Infinite Platformer - AdLearningSite</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

    <!-- Fixed levels -->
    <script src="/game-assets/levels.js"></script>

    <!-- Procedural infinite generator -->
    <script src="/game-assets/procedural_generator.js"></script>

    <!-- Level manager -->
    <script src="/game-assets/level_manager.js"></script>

</head>


<body>

<main class="container tool-page">

    <h1>🎮 Infinite Platformer</h1>

    <p>
        Reach the green goal, collect coins,
        avoid spikes, enemies and use moving platforms.
        Use <b>WASD</b> or the <b>Arrow Keys</b>.
    </p>


    <!-- =====================================================
         GAME
    ====================================================== -->

    <div id="game-wrapper">

        <canvas
            id="game"
            width="900"
            height="500">
        </canvas>

    </div>


    <!-- =====================================================
         HUD
    ====================================================== -->

    <div class="game-info">

        <span>
            Level:
            <b id="level">1</b>
        </span>

        <span>
            Deaths:
            <b id="deaths">0</b>
        </span>

        <span>
            🪙 Score:
            <b id="score">0</b>
        </span>

        <span>
            🏆 Best:
            <b id="highScore">0</b>
        </span>

        <span>
            🪙 Level:
            <b id="levelCoins">0</b>
        </span>

        <span>
            👾 Enemies:
            <b id="enemyCount">0</b>
        </span>

        <span>
            🏁 Checkpoint:
            <b id="checkpoint">START</b>
        </span>

    </div>


    <!-- =====================================================
         RESTART
    ====================================================== -->

    <button id="restart">
        🔄 Restart Level
    </button>


    <!-- =====================================================
         MESSAGE
    ====================================================== -->

    <p id="message"></p>


    <a href="/">
        ← Back to all tools
    </a>

</main>


<script>


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* =========================================================
   UI
========================================================= */

const levelDisplay =
    document.getElementById("level");

const deathsDisplay =
    document.getElementById("deaths");

const scoreDisplay =
    document.getElementById("score");

const highScoreDisplay =
    document.getElementById("highScore");

const levelCoinsDisplay =
    document.getElementById("levelCoins");

const enemyCountDisplay =
    document.getElementById("enemyCount");

const checkpointDisplay =
    document.getElementById("checkpoint");

const message =
    document.getElementById("message");

const restartButton =
    document.getElementById("restart");


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {};


document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        keys[key] = true;


        /*
         * Prevent browser scrolling.
         */

        if (
            event.key === " " ||
            event.key === "ArrowUp" ||
            event.key === "ArrowDown" ||
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   GAME STATE
========================================================= */

let currentLevel = 1;

let deaths = 0;

let score = 0;

let levelCoins = 0;

let coins = [];

let spikes = [];

let movingPlatforms = [];

let enemies = [];

let checkpoints = [];

let currentCheckpoint = null;

let player;

let platforms = [];

let goal;

let cameraX = 0;

let levelCompleting = false;

let restartLocked = false;


/* =========================================================
   HIGH SCORE
========================================================= */

let highScore =
    Number(
        localStorage.getItem(
            "adLearningPlatformerHighScore"
        )
    ) || 0;


highScoreDisplay.textContent =
    highScore;


/* =========================================================
   PHYSICS
========================================================= */

const gravity = 0.6;

const moveSpeed = 5;

const jumpPower = -12;


/* =========================================================
   LEVEL MANAGER
========================================================= */

const levelManager =
    new LevelManager();


/* =========================================================
   CREATE LEVEL
========================================================= */

function createLevel(levelNumber) {

    const level =
        levelManager.getLevel(
            levelNumber
        );


    if (!level) {

        return null;

    }


    const levelPlatforms =
        level.platforms || [];


    const lastPlatform =
        levelPlatforms[
            levelPlatforms.length - 1
        ];


    return {

        platforms:
            levelPlatforms,

        spikes:
            level.spikes || [],

        movingPlatforms:
            level.movingPlatforms || [],

        goal:
            level.goal || {

                x:
                    lastPlatform.x +
                    lastPlatform.width -
                    35,

                y:
                    lastPlatform.y -
                    70,

                width: 30,

                height: 70

            }

    };

}


/* =========================================================
   GENERATE COINS
========================================================= */

function generateCoins(platformList) {

    const newCoins = [];


    /*
     * Skip starting platform.
     */

    for (
        let i = 1;
        i < platformList.length;
        i++
    ) {

        const platform =
            platformList[i];


        let count;


        if (
            platform.width >= 170
        ) {

            count = 3;

        }

        else if (
            platform.width >= 130
        ) {

            count = 2;

        }

        else {

            count = 1;

        }


        for (
            let j = 0;
            j < count;
            j++
        ) {

            const spacing =
                platform.width /
                (count + 1);


            newCoins.push({

                x:
                    platform.x +
                    spacing * (j + 1) -
                    10,

                y:
                    platform.y - 35,

                width: 20,

                height: 20,

                collected: false

            });

        }

    }


    return newCoins;

}


/* =========================================================
   CREATE ENEMIES
========================================================= */

function createEnemies(
    platformList,
    levelNumber
) {

    const newEnemies = [];


    /*
     * Difficulty grows gradually.
     */

    const difficulty =
        Math.min(
            10,
            Math.floor(
                (levelNumber - 1) / 5
            ) + 1
        );


    /*
     * Don't put enemies on
     * the start or goal platform.
     */

    for (
        let i = 1;
        i < platformList.length - 1;
        i++
    ) {

        const platform =
            platformList[i];


        /*
         * Very small platforms
         * are skipped.
         */

        if (
            platform.width < 125
        ) {

            continue;

        }


        /*
         * Enemy probability.
         */

        const chance =
            Math.min(
                0.20 +
                difficulty * 0.035,
                0.65
            );


        if (
            Math.random() > chance
        ) {

            continue;

        }


        const enemyWidth = 32;

        const enemyHeight = 32;


        /*
         * Keep enemy away from
         * platform edges.
         */

        const leftLimit =
            platform.x + 15;


        const rightLimit =
            platform.x +
            platform.width -
            enemyWidth -
            15;


        if (
            rightLimit <= leftLimit
        ) {

            continue;

        }


        const startX =
            leftLimit +
            Math.random() *
            (
                rightLimit -
                leftLimit
            );


        /*
         * Patrol distance.
         */

        const patrolRange =
            Math.min(
                70,
                Math.max(
                    35,
                    platform.width * 0.28
                )
            );


        const patrolLeft =
            Math.max(
                leftLimit,
                startX - patrolRange
            );


        const patrolRight =
            Math.min(
                rightLimit,
                startX + patrolRange
            );


        newEnemies.push({

            x:
                startX,

            y:
                platform.y -
                enemyHeight,

            width:
                enemyWidth,

            height:
                enemyHeight,

            startX:
                startX,

            left:
                patrolLeft,

            right:
                patrolRight,

            speed:
                1.0 +
                difficulty * 0.08,

            direction:
                Math.random() < 0.5
                    ? -1
                    : 1,

            platform:
                platform

        });

    }


    return newEnemies;

}


/* =========================================================
   CREATE CHECKPOINTS
========================================================= */

function createCheckpoints(
    platformList
) {

    const newCheckpoints = [];


    /*
     * Every few platforms becomes
     * a checkpoint.
     */

    for (
        let i = 2;
        i < platformList.length - 1;
        i += 3
    ) {

        const platform =
            platformList[i];


        newCheckpoints.push({

            x:
                platform.x +
                platform.width / 2 -
                12,

            y:
                platform.y - 55,

            width: 24,

            height: 55,

            platformIndex:
                i,

            activated: false

        });

    }


    return newCheckpoints;

}


/* =========================================================
   LOAD LEVEL
========================================================= */

function loadLevel(
    levelNumber,
    spawnCheckpoint = null
) {

    currentLevel =
        levelNumber;


    const generated =
        createLevel(
            levelNumber
        );


    /*
     * Level isn't available yet.
     */

    if (!generated) {

        message.textContent =
            "⏳ Preparing more levels...";


        if (
            !levelManager.generating
        ) {

            levelManager
                .generateNextBatch()
                .then(() => {

                    loadLevel(
                        currentLevel
                    );

                });

        }


        return;

    }


    /* =====================================================
       LEVEL DATA
    ===================================================== */

    platforms =
        generated.platforms;


    spikes =
        generated.spikes;


    movingPlatforms =
        generated.movingPlatforms.map(
            platform => ({
                ...platform
            })
        );


    goal =
        generated.goal;


    /* =====================================================
       COINS
    ===================================================== */

    coins =
        generateCoins(
            platforms
        );


    levelCoins = 0;


    /* =====================================================
       ENEMIES
    ===================================================== */

    enemies =
        createEnemies(
            platforms,
            currentLevel
        );


    /* =====================================================
       CHECKPOINTS
    ===================================================== */

    checkpoints =
        createCheckpoints(
            platforms
        );


    /* =====================================================
       PLAYER
    ===================================================== */

    player = {

        x: 50,

        y: 350,

        width: 35,

        height: 50,

        velocityX: 0,

        velocityY: 0,

        grounded: false,

        groundedOnMovingPlatform: false,

        currentMovingPlatform: null

    };


    /*
     * Spawn at checkpoint.
     */

    if (
        spawnCheckpoint
    ) {

        player.x =
            spawnCheckpoint.x;

        player.y =
            spawnCheckpoint.y -
            player.height -
            5;

    }


    /* =====================================================
       CAMERA
    ===================================================== */

    cameraX =
        Math.max(
            0,
            player.x -
            canvas.width * 0.35
        );


    /* =====================================================
       STATE
    ===================================================== */

    levelCompleting = false;

    restartLocked = false;


    /* =====================================================
       UI
    ===================================================== */

    levelDisplay.textContent =
        currentLevel;


    deathsDisplay.textContent =
        deaths;


    scoreDisplay.textContent =
        score;


    highScoreDisplay.textContent =
        highScore;


    levelCoinsDisplay.textContent =
        levelCoins;


    enemyCountDisplay.textContent =
        enemies.length;


    checkpointDisplay.textContent =
        currentCheckpoint
            ? "ACTIVE"
            : "START";


    message.textContent =
        currentCheckpoint
            ? "🏁 Checkpoint spawn!"
            : "Level " +
              currentLevel +
              " — GO!";


    /* =====================================================
       PRE-GENERATE
    ===================================================== */

    if (
        levelManager.shouldGenerate(
            currentLevel
        )
    ) {

        levelManager
            .generateNextBatch();

    }

}


/* =========================================================
   RESTART LEVEL
========================================================= */

function restartLevel() {

    if (restartLocked) {

        return;

    }


    restartLocked = true;


    deaths++;


    deathsDisplay.textContent =
        deaths;


    /*
     * Return to latest checkpoint.
     */

    if (
        currentCheckpoint
    ) {

        message.textContent =
            "💥 Back to checkpoint!";

        loadLevel(
            currentLevel,
            currentCheckpoint
        );

    }

    else {

        message.textContent =
            "💥 Try again!";

        loadLevel(
            currentLevel
        );

    }


    setTimeout(() => {

        restartLocked = false;

    }, 150);

}


/* =========================================================
   NEXT LEVEL
========================================================= */

function nextLevel() {

    currentLevel++;


    /*
     * Reset checkpoint
     * for the new level.
     */

    currentCheckpoint = null;


    if (
        !levelManager.hasLevel(
            currentLevel
        )
    ) {

        message.textContent =
            "⏳ Generating next levels...";


        levelManager
            .generateNextBatch()
            .then(() => {

                loadLevel(
                    currentLevel
                );

            });


        return;

    }


    loadLevel(
        currentLevel
    );

}


/* =========================================================
   RECTANGLE COLLISION
========================================================= */

function rectanglesOverlap(
    a,
    b
) {

    return (

        a.x <
        b.x + b.width

        &&

        a.x + a.width >
        b.x

        &&

        a.y <
        b.y + b.height

        &&

        a.y + a.height >
        b.y

    );

}


/* =========================================================
   PLATFORM COLLISION
========================================================= */

function playerOnPlatform(
    platform
) {

    return (

        player.x <
        platform.x +
        platform.width

        &&

        player.x +
        player.width >
        platform.x

        &&

        player.y +
        player.height <=
        platform.y + 12

        &&

        player.y +
        player.height +
        player.velocityY >=
        platform.y

    );

}


/* =========================================================
   MOVING PLATFORM UPDATE
========================================================= */

function updateMovingPlatforms() {

    for (
        const platform of movingPlatforms
    ) {

        const previousX =
            platform.x;

        const previousY =
            platform.y;


        platform.time =
            (platform.time || 0) +
            platform.speed;


        if (
            platform.axis === "x"
        ) {

            platform.x =
                platform.startX +
                Math.sin(
                    platform.time
                ) *
                platform.range;

        }

        else {

            platform.y =
                platform.startY +
                Math.sin(
                    platform.time
                ) *
                platform.range;

        }


        platform.deltaX =
            platform.x -
            previousX;


        platform.deltaY =
            platform.y -
            previousY;

    }

}


/* =========================================================
   MOVING PLATFORM COLLISION
========================================================= */

function playerOnMovingPlatform(
    platform
) {

    return (

        player.x <
        platform.x +
        platform.width

        &&

        player.x +
        player.width >
        platform.x

        &&

        player.y +
        player.height <=
        platform.y + 12

        &&

        player.y +
        player.height +
        player.velocityY >=
        platform.y

    );

}


/* =========================================================
   UPDATE ENEMIES
========================================================= */

function updateEnemies() {

    for (
        const enemy of enemies
    ) {

        enemy.x +=
            enemy.speed *
            enemy.direction;


        if (
            enemy.x <=
            enemy.left
        ) {

            enemy.x =
                enemy.left;

            enemy.direction =
                1;

        }


        if (
            enemy.x >=
            enemy.right
        ) {

            enemy.x =
                enemy.right;

            enemy.direction =
                -1;

        }


        /*
         * Enemy stays attached
         * to its platform.
         */

        enemy.y =
            enemy.platform.y -
            enemy.height;

    }

}


/* =========================================================
   ENEMY COLLISION
========================================================= */

function checkEnemies() {

    for (
        const enemy of enemies
    ) {

        const hitbox = {

            x:
                enemy.x + 4,

            y:
                enemy.y + 4,

            width:
                enemy.width - 8,

            height:
                enemy.height - 5

        };


        if (
            rectanglesOverlap(
                player,
                hitbox
            )
        ) {

            message.textContent =
                "👾 Enemy got you!";


            restartLevel();


            return true;

        }

    }


    return false;

}


/* =========================================================
   CHECKPOINT UPDATE
========================================================= */

function updateCheckpoints() {

    for (
        const checkpoint of checkpoints
    ) {

        if (
            checkpoint.activated
        ) {

            continue;

        }


        const trigger = {

            x:
                checkpoint.x - 10,

            y:
                checkpoint.y,

            width:
                checkpoint.width + 20,

            height:
                checkpoint.height

        };


        if (
            rectanglesOverlap(
                player,
                trigger
            )
        ) {

            checkpoint.activated =
                true;


            currentCheckpoint =
                checkpoint;


            checkpointDisplay.textContent =
                "ACTIVE";


            message.textContent =
                "🏁 CHECKPOINT SAVED!";

        }

    }

}


/* =========================================================
   COIN COLLECTION
========================================================= */

function collectCoins() {

    for (
        const coin of coins
    ) {

        if (
            coin.collected
        ) {

            continue;

        }


        if (
            rectanglesOverlap(
                player,
                coin
            )
        ) {

            coin.collected =
                true;


            score += 10;

            levelCoins++;


            updateHighScore();


            scoreDisplay.textContent =
                score;


            levelCoinsDisplay.textContent =
                levelCoins;


            message.textContent =
                "🪙 +10";

        }

    }

}


/* =========================================================
   HIGH SCORE
========================================================= */

function updateHighScore() {

    if (
        score > highScore
    ) {

        highScore =
            score;


        localStorage.setItem(
            "adLearningPlatformerHighScore",
            highScore
        );


        highScoreDisplay.textContent =
            highScore;

    }

}


/* =========================================================
   SPIKE COLLISION
========================================================= */

function checkSpikes() {

    for (
        const spike of spikes
    ) {

        const hitbox = {

            x:
                spike.x + 3,

            y:
                spike.y + 5,

            width:
                Math.max(
                    1,
                    spike.width - 6
                ),

            height:
                Math.max(
                    1,
                    spike.height - 5
                )

        };


        if (
            rectanglesOverlap(
                player,
                hitbox
            )
        ) {

            message.textContent =
                "💥 Watch the spikes!";


            restartLevel();


            return true;

        }

    }


    return false;

}


/* =========================================================
   UPDATE
========================================================= */

function update() {

    if (
        !player ||
        !platforms ||
        !goal
    ) {

        return;

    }


    /* =====================================================
       MOVING PLATFORMS
    ===================================================== */

    updateMovingPlatforms();


    /*
     * Carry player with moving platform.
     */

    if (
        player.grounded &&
        player.groundedOnMovingPlatform &&
        player.currentMovingPlatform
    ) {

        const platform =
            player.currentMovingPlatform;


        player.x +=
            platform.deltaX;


        player.y +=
            platform.deltaY;

    }


    /* =====================================================
       ENEMIES
    ===================================================== */

    updateEnemies();


    /* =====================================================
       HORIZONTAL MOVEMENT
    ===================================================== */

    if (

        keys["arrowleft"] ||
        keys["a"]

    ) {

        player.velocityX =
            -moveSpeed;

    }

    else if (

        keys["arrowright"] ||
        keys["d"]

    ) {

        player.velocityX =
            moveSpeed;

    }

    else {

        player.velocityX *= 0.8;

    }


    /* =====================================================
       JUMP
    ===================================================== */

    if (

        (

            keys["arrowup"] ||
            keys["w"] ||
            keys[" "]

        )

        &&

        player.grounded

    ) {

        player.velocityY =
            jumpPower;


        player.grounded =
            false;


        player.groundedOnMovingPlatform =
            false;


        player.currentMovingPlatform =
            null;

    }


    /* =====================================================
       GRAVITY
    ===================================================== */

    player.velocityY +=
        gravity;


    /* =====================================================
       MOVE PLAYER
    ===================================================== */

    player.x +=
        player.velocityX;


    player.y +=
        player.velocityY;


    /* =====================================================
       RESET GROUND STATE
    ===================================================== */

    player.grounded =
        false;


    player.groundedOnMovingPlatform =
        false;


    player.currentMovingPlatform =
        null;


    /* =====================================================
       STATIC PLATFORM COLLISION
    ===================================================== */

    for (
        const platform of platforms
    ) {

        if (
            playerOnPlatform(
                platform
            )
        ) {

            player.y =
                platform.y -
                player.height;


            player.velocityY =
                0;


            player.grounded =
                true;

        }

    }


    /* =====================================================
       MOVING PLATFORM COLLISION
    ===================================================== */

    for (
        const platform of movingPlatforms
    ) {

        if (
            playerOnMovingPlatform(
                platform
            )
        ) {

            player.y =
                platform.y -
                player.height;


            player.velocityY =
                0;


            player.grounded =
                true;


            player.groundedOnMovingPlatform =
                true;


            player.currentMovingPlatform =
                platform;

        }

    }


    /* =====================================================
       COINS
    ===================================================== */

    collectCoins();


    /* =====================================================
       CHECKPOINTS
    ===================================================== */

    updateCheckpoints();


    /* =====================================================
       ENEMIES
    ===================================================== */

    if (
        checkEnemies()
    ) {

        return;

    }


    /* =====================================================
       SPIKES
    ===================================================== */

    if (
        checkSpikes()
    ) {

        return;

    }


    /* =====================================================
       CAMERA
    ===================================================== */

    const targetCameraX =
        player.x -
        canvas.width * 0.35;


    if (
        targetCameraX >
        cameraX
    ) {

        cameraX =
            targetCameraX;

    }


    if (
        cameraX < 0
    ) {

        cameraX = 0;

    }


    /* =====================================================
       FALL
    ===================================================== */

    if (
        player.y >
        canvas.height + 200
    ) {

        message.textContent =
            "💀 You fell!";


        restartLevel();


        return;

    }


    /* =====================================================
       GOAL COLLISION
    ===================================================== */

    if (

        !levelCompleting

        &&

        rectanglesOverlap(
            player,
            goal
        )

    ) {

        levelCompleting =
            true;


        /*
         * Bonus for finishing level.
         */

        score +=
            100 +
            levelCoins * 5;


        updateHighScore();


        scoreDisplay.textContent =
            score;


        message.textContent =
            "🎉 LEVEL COMPLETE! +BONUS";


        setTimeout(() => {

            nextLevel();

        }, 900);

    }

}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "#111827";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    ctx.fillStyle =
        "#1f2937";


    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const x =
            i * 180 -
            (cameraX * 0.15 % 180);


        ctx.fillRect(

            x,

            400,

            100,

            100

        );

    }

}


/* =========================================================
   DRAW STATIC PLATFORMS
========================================================= */

function drawPlatforms() {

    for (
        const platform of platforms
    ) {

        ctx.fillStyle =
            "#374151";


        ctx.fillRect(

            platform.x,

            platform.y,

            platform.width,

            platform.height

        );


        ctx.fillStyle =
            "#4B5563";


        ctx.fillRect(

            platform.x,

            platform.y,

            platform.width,

            5

        );

    }

}


/* =========================================================
   DRAW MOVING PLATFORMS
========================================================= */

function drawMovingPlatforms() {

    for (
        const platform of movingPlatforms
    ) {

        ctx.fillStyle =
            "#111827";


        ctx.fillRect(

            platform.x + 4,

            platform.y + 5,

            platform.width,

            platform.height

        );


        ctx.fillStyle =
            "#8B5CF6";


        ctx.fillRect(

            platform.x,

            platform.y,

            platform.width,

            platform.height

        );


        ctx.fillStyle =
            "#C4B5FD";


        ctx.fillRect(

            platform.x,

            platform.y,

            platform.width,

            5

        );

    }

}


/* =========================================================
   DRAW SPIKES
========================================================= */

function drawSpikes() {

    for (
        const spike of spikes
    ) {

        const count =
            Math.max(
                1,
                Math.floor(
                    spike.width / 16
                )
            );


        const spikeWidth =
            spike.width / count;


        for (
            let i = 0;
            i < count;
            i++
        ) {

            const x =
                spike.x +
                i * spikeWidth;


            ctx.beginPath();


            ctx.moveTo(
                x,
                spike.y +
                spike.height
            );


            ctx.lineTo(
                x +
                spikeWidth / 2,
                spike.y
            );


            ctx.lineTo(
                x +
                spikeWidth,
                spike.y +
                spike.height
            );


            ctx.closePath();


            ctx.fillStyle =
                "#EF4444";


            ctx.fill();

        }

    }

}


/* =========================================================
   DRAW COINS
========================================================= */

function drawCoins() {

    for (
        const coin of coins
    ) {

        if (
            coin.collected
        ) {

            continue;

        }


        const centerX =
            coin.x +
            coin.width / 2;


        const centerY =
            coin.y +
            coin.height / 2;


        ctx.beginPath();


        ctx.arc(

            centerX,

            centerY,

            10,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            "#FFD700";


        ctx.fill();


        ctx.strokeStyle =
            "#B8860B";


        ctx.lineWidth =
            2;


        ctx.stroke();


        ctx.fillStyle =
            "#8B6508";


        ctx.font =
            "bold 12px Arial";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.fillText(

            "$",

            centerX,

            centerY

        );

    }

}


/* =========================================================
   DRAW CHECKPOINTS
========================================================= */

function drawCheckpoints() {

    for (
        const checkpoint of checkpoints
    ) {

        /*
         * Pole.
         */

        ctx.fillStyle =
            checkpoint.activated
                ? "#F59E0B"
                : "#6B7280";


        ctx.fillRect(

            checkpoint.x,

            checkpoint.y,

            5,

            checkpoint.height

        );


        /*
         * Flag.
         */

        ctx.fillStyle =
            checkpoint.activated
                ? "#FBBF24"
                : "#9CA3AF";


        ctx.beginPath();


        ctx.moveTo(

            checkpoint.x + 5,

            checkpoint.y

        );


        ctx.lineTo(

            checkpoint.x + 30,

            checkpoint.y + 10

        );


        ctx.lineTo(

            checkpoint.x + 5,

            checkpoint.y + 20

        );


        ctx.closePath();


        ctx.fill();


        /*
         * Activated glow.
         */

        if (
            checkpoint.activated
        ) {

            ctx.strokeStyle =
                "#FDE68A";


            ctx.lineWidth =
                3;


            ctx.beginPath();


            ctx.arc(

                checkpoint.x + 3,

                checkpoint.y + 25,

                18,

                0,

                Math.PI * 2

            );


            ctx.stroke();

        }

    }

}


/* =========================================================
   DRAW ENEMIES
========================================================= */

function drawEnemies() {

    for (
        const enemy of enemies
    ) {

        /*
         * Body.
         */

        ctx.fillStyle =
            "#DC2626";


        ctx.fillRect(

            enemy.x,

            enemy.y + 8,

            enemy.width,

            enemy.height - 8

        );


        /*
         * Head.
         */

        ctx.beginPath();


        ctx.arc(

            enemy.x +
            enemy.width / 2,

            enemy.y + 9,

            12,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            "#EF4444";


        ctx.fill();


        /*
         * Eyes.
         */

        ctx.fillStyle =
            "#FFFFFF";


        ctx.fillRect(

            enemy.x + 7,

            enemy.y + 5,

            6,

            6

        );


        ctx.fillRect(

            enemy.x + 19,

            enemy.y + 5,

            6,

            6

        );


        /*
         * Pupils.
         */

        ctx.fillStyle =
            "#111827";


        ctx.fillRect(

            enemy.x + 9,

            enemy.y + 7,

            3,

            3

        );


        ctx.fillRect(

            enemy.x + 21,

            enemy.y + 7,

            3,

            3

        );


        /*
         * Feet.
         */

        ctx.fillRect(

            enemy.x + 4,

            enemy.y + enemy.height - 4,

            8,

            4

        );


        ctx.fillRect(

            enemy.x + 20,

            enemy.y + enemy.height - 4,

            8,

            4

        );

    }

}


/* =========================================================
   DRAW GOAL
========================================================= */

function drawGoal() {

    ctx.fillStyle =
        "#22C55E";


    ctx.fillRect(

        goal.x,

        goal.y,

        goal.width,

        goal.height

    );


    ctx.fillStyle =
        "#86EFAC";


    ctx.beginPath();


    ctx.moveTo(

        goal.x +
        goal.width,

        goal.y

    );


    ctx.lineTo(

        goal.x +
        goal.width +
        25,

        goal.y + 12

    );


    ctx.lineTo(

        goal.x +
        goal.width,

        goal.y + 25

    );


    ctx.closePath();


    ctx.fill();

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

    ctx.fillStyle =
        "#3B82F6";


    ctx.fillRect(

        player.x,

        player.y,

        player.width,

        player.height

    );


    /*
     * Eye white.
     */

    ctx.fillStyle =
        "#FFFFFF";


    ctx.fillRect(

        player.x + 22,

        player.y + 10,

        7,

        7

    );


    /*
     * Eye pupil.
     */

    ctx.fillStyle =
        "#111827";


    ctx.fillRect(

        player.x + 25,

        player.y + 12,

        3,

        3

    );

}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    drawBackground();


    ctx.save();


    ctx.translate(
        -cameraX,
        0
    );


    drawPlatforms();

    drawMovingPlatforms();

    drawSpikes();

    drawCheckpoints();

    drawCoins();

    drawEnemies();

    drawGoal();

    drawPlayer();


    ctx.restore();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
========================================================= */

loadLevel(1);

gameLoop();


</script>
